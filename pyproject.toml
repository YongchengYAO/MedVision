[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medvision_bm"
dynamic = ["version"]
description = "medvision_bm, a codebase for the MedVision benchmark"
requires-python = ">=3.9"
authors = [{ name = "Yongcheng Yao", email = "yc.yao@ed.ac.uk" }]
license = { text = "CC-BY 4.0" }
dependencies = [
    "datasets==3.6.0",
    "huggingface_hub==0.36.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "accelerate==1.9.0",
    "psutil==7.2.2",
    "scipy",
    "nibabel",
    "matplotlib",
]

[project.urls]
"License" = "https://creativecommons.org/licenses/by/4.0/"
"Homepage" = "https://medvision-vlm.github.io"
"Paper" = "https://arxiv.org/abs/2511.18676"
"Source" = "https://github.com/YongchengYAO/MedVision"
"Data" = "https://huggingface.co/datasets/YongchengYAO/MedVision"

[project.scripts]
mvbm = "medvision_bm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["medvision_bm*"]

[project.optional-dependencies]

# Include the vendored source as data (copied into site-packages)
[tool.setuptools.package-data]
"medvision_bm" = [
    "medvision_lmms_eval/**", 
    "medvision_lmms_eval/**/*", 
    "medvision_lmms_eval/**/.*",
    "sft/config/*.yaml"
]

[tool.setuptools.dynamic]
version = { attr = "medvision_bm.__version__" }
