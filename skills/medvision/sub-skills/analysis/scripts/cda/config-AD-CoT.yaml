# CDA model config for an ANGLE/DISTANCE (A/D) results directory.
#
# Schema: one top-level key, `model_display_name`, mapping
#   "<results folder name under the A/D task dir>": "<display name in reports>"
# Order = report order. Every listed folder MUST exist under --task_dir, or the
# CDA scripts stop with FileNotFoundError (a stale entry or an A/D-vs-T/L mix-up
# fails loudly instead of silently dropping a model). Drop --config_yaml to
# analyse every subfolder instead.
#
# This template lists the paper roster as the repository's CDA config named it.
# Folder names are RUN-SPECIFIC (bugfix suffixes, token budgets, ...): edit them
# to match the folders in your own Results/<AD task>/ directory. Keep the display
# names identical to config-TL-CoT.yaml; only folder names may differ.

model_display_name:
  "MedVision__fullRFT__qwen25vl-7b-fullSFT__AD-TL-D__512x512__PRxAnswer_s250": "MedVision-V0 (7B)"
  "gemma-3-27b-it": "Gemma-3 (27B)"
  "gemma-4-31B-it": "Gemma-4 (31B)"
  "GLM-4.6V-Budget16k": "GLM-4.6V (106B)"
  "GLM-4.6V-Flash-Budget16k": "GLM-4.6V-Flash (9B)"
  "HuatuoGPT-Vision-34B_bugfix-09206a2": "HuatuoGPT-Vision (34B)"
  "HealthGPT-L14_bugfix-2eb7706": "HealthGPT (14B)"
  "InternVL3-38B_bugfix-2eb7706": "InternVL3 (38B)"
  "lingshu-32b": "Lingshu (32B)"
  "LLaVA-OneVision_bugfix-0a4c5e2": "LLaVA-OneVision (72B)"
  "Llama-3.2-11B-Vision-Instruct_bugfix-2eb7706": "Llama-3.2-Vision (11B)"
  "MedDr__BF16": "MedDr (40B)"
  "medgemma-4b-it": "MedGemma (4B)"
  "MedGemma-27b-it-Budget8k": "MedGemma (27B)"
  "MiniMax-M3-INT4": "MiniMax-M3 (428B, int4)"
  "Qwen2.5-VL-7B-Instruct": "Qwen2.5-VL (7B)"
  "Qwen2.5-VL-32B-Instruct": "Qwen2.5-VL (32B)"
  "Qwen3-VL-32B-Thinking": "Qwen3-VL-Thinking (32B)"
