# Model config for the Detection x target-size analysis (detection_target_size.sh).
#
# Schema: one key, `model_display_name`, mapping
#   "<results folder name under the Detection task dir>": "<legend label>"
# Order = legend order. "random_detection" is the random-box baseline folder that
# analyze_detection_task_boxsize_vs_random writes into the task dir; keep it if you
# want the baseline curve. Folder names are RUN-SPECIFIC: edit them to match your
# own Results/<Detection task>/ directory. detection_target_size.sh rewrites every
# key except random_detection to "<folder>/<parsed_dirname>" before plotting, so
# the viz finds summary_metrics_per_boxImgRatio_detect_Task.json inside the parsed
# source folder.
#
# This template lists the paper roster as the repository's config named it.
model_display_name:
  "MedVision__fullRFT__qwen25vl-7b-fullSFT__AD-TL-D__512x512__PRxAnswer_s250_CoT": "MedVision-V0 (7B)"
  "gemma-3-27b-it": "Gemma-3 (27B)"
  "gemma-4-31B-it": "Gemma-4 (31B)"
  "GLM-4.6V": "GLM-4.6V (106B)"
  "GLM-4.6V-Flash": "GLM-4.6V-Flash (9B)"
  "FreedomIntelligence__HuatuoGPT-Vision-34B": "HuatuoGPT-Vision (34B)"
  "HealthGPT-L14": "HealthGPT (14B)"
  "InternVL3-38B": "InternVL3 (38B)"
  "lingshu-medical-mllm__Lingshu-32B": "Lingshu (32B)"
  "llava-onevision-qwen2-72b-ov-hf": "LLaVA-OneVision (72B)"
  "Llama-3.2-11B-Vision-Instruct-Budget16k": "Llama-3.2-Vision (11B)"
  "MedDr__BF16": "MedDr (40B)"
  "google__medgemma-4b-it": "MedGemma (4B)"
  "medgemma-27b-it": "MedGemma (27B)"
  "MiniMax-M3-INT4": "MiniMax-M3 (428B, int4)"
  "Qwen2.5-VL-7B-Instruct": "Qwen2.5-VL (7B)"
  "Qwen2.5-VL-32B-Instruct": "Qwen2.5-VL (32B)"
  "Qwen3-VL-32B-Thinking": "Qwen3-VL-Thinking (32B)"
