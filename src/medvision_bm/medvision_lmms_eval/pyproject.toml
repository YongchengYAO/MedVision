[tool.black]
line-length = 240

[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[tomli]>=6.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lmms_eval"
version = "0.3.0"
authors = [
    { name = "LMMMs-Lab Evaluation Team", email = "lmms-lab@outlook.com" },
]
description = "A framework for evaluating large multi-modality language models"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "accelerate>=0.29.1",
    "black>=24.1.0",
    "isort>=5.13.2",
    "datasets==3.6.0", # `trust_remote_code` is not supported in datasets>=4.0.0
    "evaluate>=0.4.0",
    "httpx>=0.23.3",
    "jsonlines",
    "numexpr",
    "numpy>=1.26.4",
    "peft>=0.2.0",
    "pybind11>=2.6.2",
    "pytablewriter",
    "sacrebleu>=1.5.0",
    "scikit-learn>=0.24.1",
    "sqlitedict>=2.1.0",
    "torch>=2.1.0,<2.8", # to enable sdpa mode for running 34B model on one 80GB GPU; cap below 2.8 for vllm 0.10.0 ABI compatibility
    "torchvision>=0.16.0,<0.23",
    "timm",
    "einops",
    "ftfy",
    "openai",
    "opencv-python-headless",
    "av",
    "hf_transfer",
    "nltk",
    "sentencepiece>=0.1.99",
    "yt-dlp",
    "pycocoevalcap",
    "tqdm-multiprocess",
    "transformers",
    "transformers-stream-generator",
    "zstandard",
    "pillow",
    "pyyaml",
    "sympy",
    "latex2sympy2",
    "mpmath",
    "Jinja2",
    "openpyxl",
    "loguru",
    "hf_transfer",
    "tenacity>=8.3.0",
    "wandb>=0.16.0",
    "tiktoken",
    "pre-commit",
    "pydantic",
    "packaging",
    "decord",
    "zss", 
    "protobuf>=3.20",
    "sentence_transformers",
    "qwen-vl-utils[decord]>=0.0.8", # For Qwen models
    "deepspeed",
    "bitsandbytes",
    "backoff",
]

[project.optional-dependencies]
audio = [
    "more-itertools",
    "editdistance",
    "zhconv",
    "librosa",
    "soundfile"
]
metrics = [
    "pywsd",
    "spacy",
    "anls",
    "rouge",
    "capture_metric",
    "Levenshtein",
]
meddr=[
    "bitsandbytes==0.45.2",
]
lingshu=[
    "transformers==4.52.1",
    "qwen-vl-utils==0.0.11",
]
huatuogpt_vision =[
    "transformers==4.40.0",
]
llava_med = [
    "transformers==4.37.2",
    "numpy==1.26.4",
    "protobuf>=3.20",
]
qwen2_5_vl = [
    "transformers==4.54.1",
    "accelerate==1.9.0",
    "decord",
    "qwen_vl_utils",
    "qwen-vl-utils[decord]>=0.0.8",
]
medvision_v0 = [
    "transformers==4.54.1",
    "accelerate==1.9.0",
    "decord",
    "qwen_vl_utils",
    "qwen-vl-utils[decord]>=0.0.8",
]
qwen3_vl = [
    "transformers==4.57.0",
    "qwen-vl-utils==0.0.14",
]
minimax_m3 = [
    # MiniMax-M3 VL (MiniMaxM3SparseForConditionalGeneration). The checkpoint was converted with
    # transformers 4.52.4 and its remote image_processor.py uses the fast image/video processor API;
    # the eval script force-reinstalls this version last (after vLLM) so it wins dependency
    # resolution. Used by the resize probe's AutoImageProcessor(trust_remote_code=True). vLLM (not
    # listed here) must be a build that natively registers the minimax_m3_vl architecture.
    "transformers==4.57.1",
]
gemini = [
    # >=2.8.0 for Gemini 3 support: ThinkingConfig.thinking_level does not exist in older
    # releases (verified absent in 1.47.0).
    "google-genai>=2.8.0",
    # openai SDK for the OpenRouter provider path of lmms_eval/models/gemini.py
    "openai",
    # Pin transformers to the version validated with huggingface-hub==0.36.0 (same pin
    # and rationale as the `claude` extra below): newer transformers (5.x) import
    # `is_offline_mode` from huggingface_hub, which 0.36.0 removed -> ImportError.
    "transformers==4.57.1",
]
claude = [
    "anthropic",
    "openai",
    # Pin transformers to the version validated with huggingface-hub==0.36.0 (same as the
    # Gemini path). The base `transformers` dependency is unpinned, and newer transformers
    # (5.x) import `is_offline_mode` from huggingface_hub, which 0.36.0 removed -> ImportError.
    "transformers==4.57.1",
]
openai = [
    "openai",
    # Same transformers pin and rationale as the `gemini` / `claude` extras above
    # (validated with huggingface-hub==0.36.0).
    "transformers==4.57.1",
]
reka = [
    "httpx>=0.23.3",
    "reka-api",
]
qwen = [
    "decord",
    "qwen_vl_utils",
    "qwen-vl-utils[decord]>=0.0.8",
]
mmsearch = [
    "playwright",
    "requests",
    "matplotlib",
    "duckduckgo_search",
    "langchain",
    "langchain-community",
    "beautifulsoup4",
    "FlagEmbedding",
    "rouge",
]
all = [
    "gemini",
    "reka",
    "metrics",
    "qwen",
    "mmsearch"
]

[tool.setuptools.packages.find]
include = ["lmms_eval*"]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
    "logs*",
]

[tool.wheel]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
    "logs*",
]

[project.scripts]
lmms-eval = "lmms_eval.__main__:cli_evaluate"

[project.urls]
Homepage = "https://lmms-lab.github.io"
Repository = "https://github.com/EvolvingLMMs-Lab/lmms-eval"
