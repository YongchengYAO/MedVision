# Read the Docs build configuration for MedVision
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docsite/source/conf.py
  # Surface broken cross-references / autodoc import failures as build errors.
  fail_on_warning: false

python:
  install:
    - requirements: docsite/requirements.txt

formats:
  - htmlzip
