# Read the Docs build configuration for MedVision
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docsite/source/conf.py
  # Warnings (broken cross-references, autodoc import failures) are deliberately
  # non-fatal: the build must still publish when an optional dep cannot be mocked.
  # Flip to true once the build is warning-clean.
  fail_on_warning: false

python:
  install:
    - requirements: docsite/requirements.txt

formats:
  - htmlzip
